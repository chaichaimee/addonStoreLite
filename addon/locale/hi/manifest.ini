summary = "ऐडऑन स्टोर लाइट"
description = """स्क्रीन रीडर के साथ एनवीडीए ऐड-ऑन स्टोर का उपयोग करना तेज़ बनाता है। ऐड-ऑन सूची आइटमों को छोटे रूप में (नाम, संस्करण, लेखक, तिथि) पढ़ा जाता है, जिसमें से चुनने के लिए पाँच प्रदर्शन प्रारूप हैं, खुलने की घोषणा को छोटा कर दिया जाता है, और स्टोर प्रत्येक टैब के लिए आपके अंतिम टैब, क्रमबद्ध करने के क्रम और फ़िल्टर को याद रखता है। उपलब्ध और अद्यतन करने योग्य सूचियों के संदर्भ मेनू में एक डाउनलोड आइटम चयनित ऐड-ऑन फ़ाइल को सेटिंग पैनल में निर्धारित डाउनलोड गंतव्य पर सहेजता है, और एक कॉपी डाउनलोड यूआरएल आइटम इसका पता कॉपी करता है; उस मेनू को खोलने से फ़ाइल का आकार पढ़ने के लिए ऐड-ऑन के डाउनलोड पते पर एक छोटा अनुरोध किया जाता है (प्रति ऐड-ऑन संस्करण एक बार, फिर इसे एक फ़ाइल में याद रखा जाता है), और डाउनलोड आपके चुने जाने पर ही फ़ाइल प्राप्त करता है।"""