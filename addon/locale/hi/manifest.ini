summary = "ऐड-आन स्टोर लाइट"
description = """स्क्रीन रीडर के साथ एनवीडीए ऐड-आन स्टोर का उपयोग करना तेज़ बनाता है। ऐड-आन सूची के आइटम छोटे रूप में (नाम, संस्करण, लेखक, दिनांक) पढ़े जाते हैं जिसमें चुनने के लिए चार प्रदर्शन प्रारूप हैं, शुरुआती घोषणा छोटी कर दी जाती है, और स्टोर प्रत्येक टैब के लिए आपके अंतिम टैब, छँटाई क्रम और फ़िल्टर को याद रखता है।"""