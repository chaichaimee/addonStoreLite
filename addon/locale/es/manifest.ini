summary = "Tienda de complementos ligera"
description = """Hace que la Tienda de complementos de NVDA sea más rápida de usar con un lector de pantalla. Los elementos de la lista de complementos se leen de forma abreviada (nombre, versión, autor, fecha) con cinco formatos de visualización a elegir, el anuncio de apertura se acorta y la tienda recuerda tu última pestaña, orden y filtros para cada pestaña. Un elemento Descargar en el menú contextual de las listas de disponibles y actualizables guarda el archivo del complemento seleccionado en la carpeta de descargas establecida en el panel de configuración, y un elemento Copiar URL de descarga copia su dirección; abrir ese menú realiza una pequeña solicitud a la dirección de descarga del complemento para leer el tamaño del archivo (una vez por versión del complemento, luego se recuerda en un archivo), y Descargar obtiene el archivo solo cuando lo eliges."""