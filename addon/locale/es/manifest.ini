summary = "Tienda de complementos ligera"
description = """Hace que la Tienda de complementos de NVDA sea más rápida de usar con un lector de pantalla. Los elementos de la lista de complementos se leen de forma abreviada (nombre, versión, autor, fecha) con cuatro formatos de visualización para elegir, el anuncio de apertura se acorta y la tienda recuerda su última pestaña, orden y filtros para cada pestaña."""