summary = "Add-on Store Lite"
description = """Macht die NVDA Add-on-Verwaltung für die Nutzung mit einem Screenreader schneller. Add-on-Listenelemente werden in einer Kurzform (Name, Version, Autor, Datum) mit vier anpassbaren Anzeigeformaten vorgelesen, die Begrüßungsansage wird verkürzt und der Store merkt sich für jeden Reiter den zuletzt verwendeten Reiter, die Sortierung und die Filter."""