summary = "Add-on Store Lite"
description = """Macht den NVDA Add-on Store für die Verwendung mit einem Bildschirmleseprogramm schneller. Add-on-Listenelemente werden in einer Kurzform vorgelesen (Name, Version, Autor, Datum), wobei fünf Anzeigeformate zur Auswahl stehen, die Begrüßungsansage wird verkürzt und der Store merkt sich für jeden Reiter den zuletzt verwendeten Reiter, die Sortierreihenfolge sowie die Filter. Ein Herunterladen-Eintrag im Kontextmenü der Listen für verfügbare und aktualisierbare Add-ons speichert die ausgewählte Add-on-Datei im in den Einstellungen festgelegten Download-Ziel, und ein Eintrag zum Kopieren der Download-URL kopiert deren Adresse; das Öffnen dieses Menüs sendet eine kleine Anfrage an die Download-Adresse des Add-ons, um die Dateigröße zu ermitteln (einmal pro Add-on-Version, danach wird sie in einer Datei gespeichert), und Herunterladen ruft die Datei erst ab, wenn Sie dies auswählen."""