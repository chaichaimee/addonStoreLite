summary = "Loja de Complementos Lite"
description = """Torna a Loja de Complementos do NVDA mais rápida de usar com um leitor de tela. Os itens da lista de complementos são lidos de forma concisa (nome, versão, autor, data) com quatro formatos de exibição à escolha, o anúncio de abertura é encurtado e a loja lembra sua última aba, ordem de classificação e filtros para cada aba."""