summary = "Loja de Complementos Lite"
description = """Torna a Loja de Complementos do NVDA mais rápida de usar com um leitor de tela. Os itens da lista de complementos são lidos de forma resumida (nome, versão, autor, data) com cinco formatos de exibição à escolha, o anúncio de abertura é encurtado e a loja lembra sua última aba, ordem de classificação e filtros para cada aba. Um item Baixar no menu de contexto das listas Disponíveis e Atualizáveis salva o arquivo do complemento selecionado no destino de download definido no painel de configurações, e um item Copiar URL de download copia seu endereço; abrir esse menu faz uma pequena solicitação ao endereço de download do complemento para ler o tamanho do arquivo (uma vez por versão do complemento, depois é lembrado em um arquivo), e Baixar busca o arquivo apenas quando você o escolhe."""