summary = "アドオンストア ライト"
description = """NVDAアドオンストアをスクリーンリーダーでより快適に利用できるようにします。アドオンリストの項目は短縮形式（名前、バージョン、作者、日付）で読み上げられ、5つの表示形式から選択できます。また、起動時のアナウンスが短縮され、各タブの最後のタブ、並べ替え順、フィルターが記憶されます。「利用可能」および「アップデート可能」リストのコンテキストメニューにある「ダウンロード」項目は、設定パネルで指定したダウンロード先に選択したアドオンファイルを保存し、「ダウンロードURLをコピー」項目はそのアドレスをコピーします。このメニューを開くと、アドオンのダウンロードアドレスへファイルサイズを取得するための小さなリクエストが1回送信され（アドオンのバージョンごとに1回、以降はファイルに記憶されます）、「ダウンロード」を実行したときのみファイルが取得されます。"""