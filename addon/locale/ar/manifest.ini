summary = "متجر الإضافات الخفيف"
description = """يجعل متجر إضافات NVDA أسرع في الاستخدام مع قارئ الشاشة. تُقرأ عناصر قائمة الإضافات بشكل مختصر (الاسم، الإصدار، المؤلف، التاريخ) مع خمسة تنسيقا للعرض للاختيار من بينها، ويتم تقصير إعلان الفتح، ويتذكر المتجر علامة التبويب الأخيرة، وترتيب الفرز، والتصفيات لكل علامة تبويب. عنصر التنزيل في قائمة السياق لقائمتي المتاحة والقابلة للتحديث يحفظ ملف الإضافات المحدد في وجهة التنزيل المعينة في لوحة الإعدادات، وعنصر نسخ عنوان URL للتنزيل ينسخ عنوانه؛ يؤدي فتح هذه القائمة إلى إرسال طلب صغير واحد إلى عنوان تنزيل الإضافة لقراءة حجم الملف (مرة واحدة لكل إصدار من الإضافة، ثم يتم تذكره في ملف)، ولا يجلب التنزيل الملف إلا عند اختياره."""