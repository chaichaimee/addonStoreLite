summary = "متجر الإضافات الخفيف"
description = """يجعل متجر إضافات NVDA أسرع في الاستخدام بواسطة قارئ الشاشة. تُقرأ عناصر قائمة الإضافات بشكل مختصر (الاسم، الإصدار، المؤلف، التاريخ) مع أربعة تنسيقات عرض للاختيار من بينها، ويتم اختصار إعلان الفتح، كما يتذكر المتجر علامة التبويب الأخيرة، وترتيب الفرز، والواملات لكل علامة تبويب."""