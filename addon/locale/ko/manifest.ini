summary = "애드온 스토어 라이트"
description = """스크린 리더로 NVDA 애드온 스토어를 더 빠르게 사용할 수 있습니다. 애드온 목록 항목이 간소화된 형식(이름, 버전, 작성자, 날짜)으로 읽히며 5가지 표시 형식 중 선택할 수 있습니다. 시작 안내 음성이 단축되며, 스토어는 각 탭의 마지막 탭, 정렬 순서 및 필터를 기억합니다. 사용 가능 및 업데이트 가능 목록의 맥락 메뉴에 있는 '다운로드' 항목은 선택한 애드온 파일을 설정 패널에 지정된 다운로드 폴더에 저장하고, '다운로드 URL 복사' 항목은 주소를 복사합니다. 해당 메뉴를 열면 파일 크기를 읽기 위해 애드온 다운로드 주소로 한 번 가벼운 요청을 보냅니다(애드온 버전당 한 번이며 이후 파일에 저장됨). '다운로드'는 사용자가 선택할 때만 파일을 가져옵니다."""