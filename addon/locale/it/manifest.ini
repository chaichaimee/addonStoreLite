summary = "mağaza eklentisi Lite"
description = """Ekran okuyucu ile NVDA Eklenti Mağazası'nın kullanımını hızlandırır. Eklenti listesi öğeleri, aralarından seçim yapabileceğiniz beş görünüm biçimiyle kısa biçimde (ad, sürüm, yazar, tarih) okunur, açılış duyurusu kısaltılır ve mağaza her sekme için son sekmənizi, sıralama düzeninizi ve filtrelerinizi hatırlar. Mevcut ve Güncellenebilir listelerinin içerik menüsündeki İndir öğesi, seçilen eklenti dosyasını ayarlar panelinde belirlenen indirme hedefine kaydeder ve İndirme URL'sini Kopyala öğesi adresini kopyalar; bu menünün açılması, dosya boyutunu okumak için eklentinin indirme adresine küçük bir istek gönderir (eklenti sürümü başına bir kez, ardından bir dosyada hatırlanır) ve İndir, dosyayı yalnızca siz seçtiğinizde getirir."""