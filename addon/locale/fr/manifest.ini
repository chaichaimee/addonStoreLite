summary = "Magasin d'extensions allégé"
description = """Accélère l'utilisation du magasin d'extensions d'NVDA avec un lecteur d'écran. Les éléments de la liste des extensions sont lus de manière abrégée (nom, version, auteur, date) avec cinq formats d'affichage au choix, l'annonce d'ouverture est raccourcie et le magasin mémorise votre dernier onglet, l'ordre de tri et les filtres pour chaque onglet. Un élément Télécharger dans le menu contextuel des listes Disponible et Mutable enregistre le fichier de l'extension sélectionnée dans la destination de téléchargement définie dans le panneau des paramètres, et un élément Copier l'URL de téléchargement copie son adresse ; l'ouverture de ce menu effectue une petite requête à l'adresse de téléchargement de l'extension pour lire la taille du fichier (une fois par version d'extension, puis elle est mémorisée dans un fichier), et Télécharger ne récupère le fichier que lorsque vous le choisissez."""