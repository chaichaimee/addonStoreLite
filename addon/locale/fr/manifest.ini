summary = "Magasin d'extensions Lite"
description = """Rend l'utilisation du magasin d'extensions NVDA plus rapide avec un lecteur d'écran. Les éléments de la liste des extensions sont lus sous une forme courte (nom, version, auteur, date) avec quatre formats d'affichage au choix, l'annonce d'ouverture est raccourcie et le magasin mémorise votre dernier onglet, ordre de tri et filtres pour chaque onglet."""