summary = "Магазин дополнений Lite"
description = """Ускоряет работу с Магазином дополнений NVDA при использовании программы чтения с экрана. Элементы списка дополнений зачитываются в краткой форме (название, версия, автор, дата) с возможностью выбора из четырех форматов отображения, приветственное объявление сокращено, а магазин запоминает последнюю вкладку, порядок сортировки и фильтры для каждой вкладки."""