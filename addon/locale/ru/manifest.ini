summary = "Магазин дополнений Lite"
description = """Ускоряет работу с Магазином дополнений NVDA с помощью программы чтения с экрана. Элементы списка дополнений зачитываются в краткой форме (название, версия, автор, дата) с возможностью выбора из пяти форматов отображения, приветственное объявление сокращено, а магазин запоминает последнюю вкладку, порядок сортировки и фильтры для каждой вкладки. Пункт «Скачать» в контекстном списке доступных и обновляемых дополнений сохраняет выбранный файл дополнения в папку загрузок, указанную в панели настроек, а пункт «Копировать ссылку для скачивания» копирует его адрес; открытие этого меню делает один небольшой запрос по адресу скачивания дополнения для чтения размера файла (один раз для каждой версии дополнения, после чего он сохраняется в файле), а загрузка файла происходит только при выборе этого действия."""