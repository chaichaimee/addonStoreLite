summary = "Додаток Store Lite"
description = """Робить магазин доповнень NVDA зручнішим і швидшим у використанні з екранним читачем. Елементи списку доповнень озвучуються в скороченій формі (назва, версія, автор, дата) з чотирма форматами відображення на вибір, вітальне повідомлення скорочено, а магазин запам'ятовує останню вкладку, порядок сортування та фільтри для кожної вкладки."""