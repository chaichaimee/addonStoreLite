summary = "Магазин додатків Lite"
description = """Робить магазин додатків NVDA зручнішим і швидшим у використанні з екрана. Елементи списку додатків озвучуються в скороченій формі (назва, версія, автор, дата) з п'ятьма форматами відображення на вибір, оголошення про відкриття скорочено, а магазин запам'ятовує останню вкладку, порядок сортування та фільтри для кожної вкладки. Елемент Завантажити в контекстному списку доступних та оновлюваних додатків зберігає вибраний файл додатка до папки завантаження, заданої в панелі налаштувань, а елемент Скопіювати URL завантаження копіює його адресу; відкриття цього меню робить один невеликий запит на адресу завантаження додатка для читання розміру файлу (один раз для кожної версії додатка, після чого це запам'ятовується у файлі), а Завантажити отримує файл лише тоді, коли ви це виберете."""