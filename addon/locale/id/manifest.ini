summary = "Toko Add-on Lite"
description = """Membuat Toko Add-on NVDA lebih cepat digunakan dengan pembaca layar. Item daftar add-on dibaca dalam bentuk singkat (nama, versi, penulis, tanggal) dengan lima format tampilan yang dapat dipilih, pengumuman pembukaan dipersingkat, dan toko mengingat tab terakhir, urutan penyortiran, dan filter untuk setiap tab. Item Unduh di menu konteks dari daftar Tersedia dan Dapat Diperbarui menyimpan file add-on yang dipilih ke tujuan unduhan yang diatur di panel pengaturan, dan item Salin URL unduhan menyalin alamatnya; membuka menu tersebut membuat satu permintaan kecil ke alamat unduh add-on untuk membaca ukuran file (sekali per versi add-on, kemudian diingat dalam file), dan Unduh mengambil file hanya saat Anda memilihnya."""