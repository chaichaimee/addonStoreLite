summary = "แอดออนสโตร์ไลต์"
description = """ทำให้ใช้งานร้านค้าแอดออน NVDA ได้รวดเร็วยิ่งขึ้นด้วยโปรแกรมอ่านหน้าจอ รายการแอดออนจะถูกอ่านแบบย่อ (ชื่อ,เวอร์ชัน,ผู้พัฒนา,วันที่) พร้อมรูปแบบการแสดงผล 5 แบบให้เลือก, เสียงประกาศเปิดใช้งานจะสั้นลง และร้านค้าจะจดจำแท็บล่าสุด, ลำดับการเรียง และตัวกรองสำหรับแต่ละแท็บ เมนูบริบทของรายการแอดออนที่มีและอัปเดตได้จะมีรายการ "ดาวน์โหลด" เพื่อบันทึกไฟล์แอดออนที่เลือกไปยังปลายทางการดาวน์โหลดที่ตั้งค่าไว้ในแผงตั้งค่า และมีรายการ "คัดลอก URL ดาวน์โหลด" สำหรับคัดลอกที่อยู่ การเปิดเมนูนั้นจะส่งคำขอขนาดเล็กไปยังที่อยู่ดาวน์โหลดของแอดออนเพื่ออ่านขนาดไฟล์ (หนึ่งครั้งต่อเวอร์ชัน จากนั้นจะบันทึกไว้ในไฟล์) และคำสั่งดาวน์โหลดจะดึงไฟล์มาเฉพาะเมื่อคุณเลือกเท่านั้น"""