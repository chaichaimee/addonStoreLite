summary = "ร้านค้าส่วนเสริมอย่างย่อ"
description = """ทำให้หน้าต่างร้านค้าส่วนเสริมของ NVDA ใช้งานได้รวดเร็วยิ่งขึ้นด้วยโปรแกรมอ่านจอภาพ รายการส่วนเสริมจะถูกอ่านแบบย่อ (ชื่อ, เวอร์ชัน, ผู้พัฒนา, วันที่) พร้อมรูปแบบการแสดงผล 4 แบบให้เลือก, ตัดทอนประกาศเปิดร้านค้าให้สั้นลง และร้านค้าจะจดจำแท็บล่าสุด, ลำดับการเรียง และตัวกรองสำหรับแต่ละแท็บ"""